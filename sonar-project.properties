# Paths below are relative to this file (the repository root).
sonar.projectKey=Robel-Manoa_client-service-portal
sonar.organization=robel-manoa

sonar.projectName=Client Service Portal
sonar.projectVersion=1.0

# Frontend (client-service-portal/) is intentionally out of scope: it's
# plain browser JS with no test tooling allowed (no DOM in Node without a
# library), so it would only ever show as 0% coverage. Scoping the scan
# to the backend, which has real tests behind it, keeps the coverage
# metric meaningful.
sonar.sources=server-client-service-portal/src
sonar.tests=server-client-service-portal/tests
sonar.test.inclusions=server-client-service-portal/tests/**/*.test.ts

# Both keys point at the same lcov file: modern SonarJS only needs the
# javascript one, but setting typescript too is the documented-safe way
# to handle a mixed JS/TS project without depending on plugin version.
sonar.javascript.lcov.reportPaths=server-client-service-portal/coverage/lcov.info
sonar.typescript.lcov.reportPaths=server-client-service-portal/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/dist/**,**/*.pdf

sonar.sourceEncoding=UTF-8
