# SonarCloud / SonarQube configuration for the Client Service Portal monorepo.
# Paths below are relative to this file (the repository root).
sonar.projectKey=Robel-Manoa_client-service-portal
sonar.organization=robel-manoa

sonar.projectName=Client Service Portal
sonar.projectVersion=1.0

# Two components live in this repo: a static frontend (plain HTML/CSS/JS)
# and a Node/TypeScript backend API.
sonar.sources=client-service-portal,server-client-service-portal/src
sonar.tests=server-client-service-portal/tests
sonar.test.inclusions=server-client-service-portal/tests/**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/*.pdf

sonar.sourceEncoding=UTF-8
